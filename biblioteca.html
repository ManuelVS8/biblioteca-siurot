<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca Siurot</title>
<meta name="theme-color" content="#1f4e4a">
<meta name="description" content="Biblioteca de relatos, cuentos y poemas del alumnado del CEIP Manuel Siurot">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4e4a'/%3E%3Cpath d='M14 18h14a6 6 0 0 1 4 2 6 6 0 0 1 4-2h14v28H36a6 6 0 0 0-4 2 6 6 0 0 0-4-2H14z' fill='%23fff'/%3E%3Cpath d='M32 20v28' stroke='%231f4e4a' stroke-width='2'/%3E%3Cpath d='M42 18v14l3-2 3 2V18' fill='%23f2b62c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Lexend:wght@300;400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400;1,7..72,700&family=Andika:ital,wght@0,400;0,700;1,400;1,700&family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Playwrite+ES:wght@100..400&display=swap" rel="stylesheet">
<style>
:root{
  --pizarra:#1f4e4a; --pizarra2:#163a37; --tiza:#e8f1ee;
  --papel:#eef3f1; --hoja:#ffffff; --tinta:#1d2a2e; --gris:#5b6a6d; --gris2:#8a9799;
  --linea:#d2dddb; --lapiz:#f2b62c; --lapiz2:#c98d00; --rojo:#c0392b; --verde:#2e7d4f;
  --madera:#9a6a3c; --madera2:#7a5230;
  --r:14px; --sombra:0 1px 2px rgba(22,58,55,.08),0 6px 18px rgba(22,58,55,.07);
  --titulos:'Young Serif',Georgia,serif; --ui:'Lexend',system-ui,sans-serif; --libro:'Literata',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lapiz);outline-offset:2px}
h1,h2,h3{font-family:var(--titulos);font-weight:400;line-height:1.2;margin:0}
a{color:var(--pizarra)}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- barra superior ---------- */
.barra{position:sticky;top:0;z-index:20;background:var(--pizarra);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));box-shadow:0 2px 0 var(--pizarra2)}
.barra .atras{background:rgba(255,255,255,.12);border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:1.3rem;display:grid;place-items:center}
.barra .atras:hover{background:rgba(255,255,255,.22)}
.marca{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:4px 6px;border-radius:10px;min-width:0}
.marca svg{flex:none}
.marca span{font-family:var(--titulos);font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .esp{flex:1}
.yo{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:4px 12px 4px 4px;max-width:46vw}
.yo .ini{width:34px;height:34px;border-radius:50%;background:var(--lapiz);color:var(--pizarra2);display:grid;place-items:center;font-weight:700;flex:none}
.yo .nom{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.yo .nom{display:none}.yo{padding:4px}}
.menuyo{position:absolute;right:12px;top:calc(62px + env(safe-area-inset-top));background:var(--hoja);color:var(--tinta);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.2);min-width:230px;padding:6px;z-index:30}
.menuyo button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:10px}
.menuyo button:hover{background:var(--papel)}
.menuyo .cab{padding:10px 12px;border-bottom:1px solid var(--linea);margin-bottom:4px}
.menuyo .cab b{display:block}
.menuyo .cab small{color:var(--gris)}

main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.estrecho{max-width:760px;margin:0 auto}

/* ---------- botones y campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--pizarra);color:#fff;min-height:46px;text-decoration:none;transition:transform .08s,background .15s}
.btn:hover{background:var(--pizarra2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--hoja);color:var(--pizarra);box-shadow:inset 0 0 0 2px var(--linea)}
.btn.sec:hover{box-shadow:inset 0 0 0 2px var(--pizarra)}
.btn.amar{background:var(--lapiz);color:var(--pizarra2)}
.btn.amar:hover{background:#e6a817}
.btn.rojo{background:var(--rojo)}
.btn.peq{min-height:38px;padding:7px 12px;font-size:.9rem;border-radius:10px}
.btn.txt{background:none;color:var(--pizarra);padding:8px 10px;min-height:38px}
.btn.txt:hover{background:rgba(31,78,74,.08)}
.campo{display:block;margin-bottom:14px}
.campo>span{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
.campo small{color:var(--gris);font-weight:400}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:2px solid var(--linea);background:var(--hoja);border-radius:12px;padding:12px 14px;min-height:50px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pizarra)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;user-select:none}
.check input{width:22px;height:22px;accent-color:var(--pizarra)}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fila.fin{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}

.hoja{background:var(--hoja);border-radius:var(--r);box-shadow:var(--sombra);padding:18px}
.seccion{margin-top:30px}
.seccion>h2{font-size:1.45rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.seccion>h2 .mas{margin-left:auto;font-family:var(--ui);font-size:.9rem}
.vacio{text-align:center;color:var(--gris);padding:30px 16px;background:var(--hoja);border-radius:var(--r);border:2px dashed var(--linea)}
.vacio .btn{margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;background:var(--papel);color:var(--pizarra)}
.chip.borrador{background:#eceff0;color:#4b5759}
.chip.publicado{background:#dff1e6;color:#1f6b40}
.chip.revisar{background:#fbe3e0;color:#9d2c20}
.chip.reto{background:#fff2cc;color:#7a5800}
.chip.dest{background:var(--lapiz);color:var(--pizarra2)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--pizarra);background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.07),transparent 40%),radial-gradient(circle at 85% 90%,rgba(242,182,44,.12),transparent 45%)}
.login .caja{width:100%;max-width:420px}
.login .logo{display:flex;flex-direction:column;align-items:center;color:#fff;margin-bottom:22px;text-align:center}
.login .logo h1{font-size:2.3rem;margin-top:12px}
.login .logo p{margin:6px 0 0;color:var(--tiza);opacity:.85}
.login .hoja{padding:24px}
.login input{min-height:58px;font-size:1.1rem}
.login .btn{width:100%;min-height:56px;font-size:1.1rem;margin-top:6px}
.login .nota{font-size:.88rem;color:var(--gris);margin-top:14px;text-align:center}
.con-ojo{position:relative}
.con-ojo input{padding-right:60px}
.ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;min-width:46px;min-height:46px;font-size:1.25rem;border-radius:10px;display:grid;place-items:center}
.ojo:hover{background:var(--papel)}
.err{background:#fbe3e0;color:#8f2418;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}

/* ---------- inicio ---------- */
.saludo{background:var(--pizarra);color:#fff;border-radius:20px;padding:24px 22px;position:relative;overflow:hidden}
.saludo::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:rgba(242,182,44,.14)}
.saludo h1{font-size:clamp(1.8rem,5vw,2.6rem)}
.saludo p{margin:6px 0 18px;color:var(--tiza);max-width:46ch}
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.acc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:16px;padding:14px;text-align:left;min-height:96px;transition:background .15s}
.acc:hover{background:rgba(255,255,255,.18)}
.acc .ic{font-size:1.6rem;line-height:1}
.acc b{font-size:1.02rem}
.acc small{color:var(--tiza);opacity:.85;font-size:.82rem;line-height:1.3}
.acc.prim{background:var(--lapiz);color:var(--pizarra2)}
.acc.prim small{color:var(--pizarra2);opacity:.8}
.acc.prim:hover{background:#ffc742}
@media(max-width:560px){.saludo::after{display:none}.acciones{grid-template-columns:1fr}.acc{min-height:0;flex-direction:row;align-items:center;gap:12px}.acc small{display:none}}
.aviso{display:flex;gap:12px;align-items:flex-start;background:#fff8e1;border-left:5px solid var(--lapiz);border-radius:12px;padding:14px 16px;margin-top:16px}
.aviso.rojo{background:#fdecea;border-color:var(--rojo)}
.aviso.verde{background:#e5f4ea;border-color:var(--verde)}
.aviso .ic{font-size:1.4rem;line-height:1.2}
.aviso p{margin:0}
.aviso .btn{margin-top:8px}

/* retos */
.retos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.reto{background:var(--hoja);border-radius:var(--r);box-shadow:var(--sombra);padding:16px;border-top:6px solid var(--lapiz);display:flex;flex-direction:column;gap:8px}
.reto h3{font-size:1.2rem}
.reto p{margin:0;color:var(--gris)}
.reto .fila{margin-top:auto}

/* podio: libros en una balda */
.estante{background:var(--hoja);border-radius:20px;box-shadow:var(--sombra);padding:22px 14px 0;overflow:hidden}
.podio{display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,4vw,36px);min-height:260px}
.podio .puesto{display:flex;flex-direction:column;align-items:center;width:clamp(96px,26vw,170px)}
.podio .medalla{font-size:1.7rem;margin-bottom:4px}
.podio .lp{width:100%;border:0;padding:0;background:none;text-align:left}
.podio .p1 .tapa{height:230px}
.podio .p2 .tapa{height:192px}
.podio .p3 .tapa{height:168px}
.podio .nota{font-size:.85rem;margin:6px 0 10px;text-align:center}
@media(max-width:520px){.podio .tapa{padding:10px 8px 10px 18px}.podio .tapa .tt{font-size:.92rem;-webkit-line-clamp:5}.podio .tapa .emo{font-size:2rem}.podio .p1 .tapa{height:210px}.podio .p2 .tapa{height:180px}.podio .p3 .tapa{height:160px}}
.balda{height:16px;background:linear-gradient(var(--madera),var(--madera2));border-radius:3px 3px 0 0;margin:0 -14px;box-shadow:0 -2px 0 rgba(0,0,0,.06) inset}
.podio-vacio{padding:26px 10px 30px;text-align:center;color:var(--gris)}

/* ---------- libros (portadas) ---------- */
.estanteria{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 16px}
@media(max-width:420px){.estanteria{grid-template-columns:repeat(2,1fr);gap:18px 12px}}
.libro{display:flex;flex-direction:column;border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0}
.tapa{position:relative;width:100%;aspect-ratio:3/4.2;border-radius:4px 12px 12px 4px;background:var(--c,#2f7d5b);color:#fff;padding:14px 12px 12px 22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.15),4px 6px 14px rgba(22,58,55,.18);transition:transform .15s ease,box-shadow .15s ease}
.podio .tapa{aspect-ratio:auto}
.libro:hover .tapa,.lp:hover .tapa{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 1px 0 rgba(0,0,0,.15),8px 12px 22px rgba(22,58,55,.24)}
.tapa::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:rgba(0,0,0,.22);box-shadow:2px 0 0 rgba(255,255,255,.18)}
.tapa::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 40%);pointer-events:none}
.tapa .emo{font-size:2.4rem;line-height:1;margin-bottom:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.tapa .tt{font-family:var(--titulos);font-size:1.12rem;line-height:1.18;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.tapa .au{font-size:.78rem;opacity:.92;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tapa .cinta{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--lapiz);display:grid;place-items:center;font-size:.85rem;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tapa .leido{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);color:var(--verde);border-radius:999px;width:26px;height:26px;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.tapa .cinta + .leido{top:auto;bottom:8px}
.pie{padding:8px 2px 0;font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;color:var(--gris)}
.pie .gen{width:100%;color:var(--gris2);font-size:.78rem}
.est{display:inline-flex;align-items:center;gap:4px;color:var(--tinta);font-weight:600}
.estrellas{position:relative;display:inline-block;font-size:1em;line-height:1;letter-spacing:1px;color:#d8dfdd}
.estrellas i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--lapiz);font-style:normal}
.fila-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.fila-scroll .libro{scroll-snap-align:start}

/* ---------- biblioteca: filtros ---------- */
.filtros{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.busca{position:relative}
.busca input{padding-left:44px}
.busca::before{content:"🔎";position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:2px solid var(--linea);background:var(--hoja);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;color:var(--gris)}
.chips button.on{background:var(--pizarra);border-color:var(--pizarra);color:#fff}
.orden{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:600px){.orden{grid-template-columns:1fr 1fr}.orden .solo{grid-column:1/-1}}
.orden select{min-height:44px;padding:8px 12px}
.contador{color:var(--gris);font-size:.9rem;margin:-6px 0 12px}

/* ---------- lector ---------- */
.ficha{background:var(--hoja);border-radius:20px;box-shadow:var(--sombra);overflow:hidden;display:grid;grid-template-columns:150px 1fr}
.ficha .mini{padding:18px 0 18px 18px}
.ficha .mini .tapa{aspect-ratio:3/4.2}
.ficha .info{padding:20px}
.ficha h1{font-size:clamp(1.6rem,4.5vw,2.3rem);word-break:break-word}
.ficha .por{margin:8px 0 10px;font-size:1.02rem}
.ficha .por button{background:none;border:0;padding:0;color:var(--pizarra);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.datos{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--gris);font-size:.9rem}
.datos span{display:inline-flex;gap:5px;align-items:center}
@media(max-width:560px){.ficha{grid-template-columns:96px 1fr}.ficha .mini{padding:14px 0 14px 14px}.ficha .info{padding:14px}.ficha .mini .tapa .tt,.ficha .mini .tapa .au{display:none}.ficha .mini .tapa .emo{font-size:2rem}}
.herr{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px;align-items:center}
.herr button{border:2px solid var(--linea);background:var(--hoja);border-radius:10px;min-width:44px;min-height:42px;padding:6px 10px;font-weight:600}
.herr button.on{border-color:var(--pizarra);background:var(--pizarra);color:#fff}
.herr .esp{flex:1}
.lectura{background:var(--hoja);border-radius:20px;box-shadow:var(--sombra);padding:clamp(20px,5vw,48px);font-family:var(--libro);font-size:calc(1.12rem * var(--zoom,1));line-height:1.75;color:var(--tinta);overflow-wrap:break-word;transition:background .2s,color .2s}
.lectura.sepia{background:#f6efdf;color:#3b3024}
.lectura.noche{background:#1d2628;color:#e2ebe9}
.lectura p{margin:0 0 1em}
.lectura div{min-height:1em}
.texto-relato p:last-child{margin-bottom:0}
.fin-marca{text-align:center;margin-top:28px;font-family:var(--titulos);color:var(--gris2);font-size:1.1rem;letter-spacing:.2em}
.lectura.noche .fin-marca{color:#93a3a5}

.valorar{margin-top:22px}
.valorar h2{font-size:1.4rem;margin-bottom:6px}
.selestr{display:flex;gap:4px;margin:10px 0 4px}
.selestr button{background:none;border:0;font-size:2.6rem;line-height:1;color:#d3dbd9;padding:2px;transition:transform .1s,color .1s}
.selestr button.on{color:var(--lapiz)}
.selestr button:hover{transform:scale(1.12)}
.selestr-txt{min-height:1.5em;color:var(--gris);font-weight:600}
.empiezos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.empiezos button{border:1px dashed var(--gris2);background:var(--papel);border-radius:999px;padding:5px 12px;font-size:.85rem}
.cuenta{font-size:.82rem;color:var(--gris);text-align:right;margin-top:4px}
.bloqueo{display:flex;gap:12px;align-items:center;padding:16px;border-radius:14px;background:var(--papel);color:var(--gris)}
.bloqueo .ic{font-size:1.8rem}

.resenas{display:flex;flex-direction:column;gap:12px}
.resena{background:var(--hoja);border-radius:var(--r);box-shadow:var(--sombra);padding:16px}
.resena.maestro{border-left:5px solid var(--pizarra)}
.resena.mia{border-left:5px solid var(--lapiz)}
.resena.avisada{outline:2px solid var(--rojo)}
.resena .cab{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.resena .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.resena .quien{display:flex;flex-direction:column;line-height:1.25}
.resena .quien small{color:var(--gris)}
.resena .cab .estrellas{margin-left:auto;font-size:1.1rem}
.resena p{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:break-word}
.resena .acts{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}

/* ---------- editor ---------- */
.editor-top{display:grid;grid-template-columns:1fr 210px;gap:12px}
@media(max-width:700px){.editor-top{grid-template-columns:1fr}}
.titulo-in{font-family:var(--titulos)!important;font-size:1.5rem!important;min-height:58px!important}
.portada-sel{display:flex;gap:12px;align-items:center}
.portada-sel .tapa{width:92px;flex:none;padding:10px 8px 8px 16px}
.portada-sel .tapa .emo{font-size:1.9rem}
.portada-sel .tapa .tt{font-size:.75rem}
.colores{display:flex;flex-wrap:wrap;gap:6px}
.colores button{width:30px;height:30px;border-radius:8px;border:3px solid transparent;background:var(--c)}
.colores button.on{border-color:var(--tinta)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:260px;overflow:auto}
.emojis button{font-size:1.6rem;border:2px solid var(--linea);background:var(--hoja);border-radius:10px;height:48px}
.emojis button.on{border-color:var(--pizarra);background:var(--papel)}

  set(k, v) { try { localStorage.setItem(PREF + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(PREF + k); } catch {} }

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fecha(ms) { if (!ms) return ''; const d = new Date(ms); return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear(); }
function haceTiempo(ms) {
  if (!ms) return ''; const s = (ahora() - ms) / 1000;
  if (s < 60) return 'ahora mismo'; if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'hace ' + Math.floor(s / 3600) + ' h';
  if (s < 86400 * 7) { const d = Math.floor(s / 86400); return d === 1 ? 'ayer' : 'hace ' + d + ' días'; }
  return fecha(ms);
}
const nfmt = n => (Math.round(n * 10) / 10).toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const normal = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const comparaTexto = (a, b) => String(a).localeCompare(String(b), 'es', { numeric: true, sensitivity: 'base' });

function colorPersona(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORES[h % COLORES.length]; }

/* ---------------------------- constantes ---------------------------- */
const COLORES = ['#2f6f9f','#b0503a','#2e7d57','#7a4f9a','#c48a1a','#23707c','#9c3d5c','#566330','#2c3e66','#a5642a','#4f8a3a','#6b4e3d'];
const EMOJIS = ['📖','🐉','🏰','🌙','🚀','🐱','🐶','🌳','⚽','🧙','👻','🦄','🏴‍☠️','🌊','🎃','❄️','🌈','🦊','🐢','🤖','👽','🦖','🍕','🎭','🎈','🔍','🗝️','📜','⭐','🌋','🐙','🦁','🐼','🐧','🌸','🍀','🔥','💎','🎵','🧸','🚂','🏝️','🦋','🐝','🌻','🍄','🧚','🦉','🐺','🐬','🌍','🏆','💌','🎨','⛵','🚲','🏠','👑','🗺️','🕰️'];
const GENEROS = ['Cuento','Relato','Poema','Fábula','Leyenda','Diario','Carta','Teatro','Noticia','Otro'];
const FUENTES = [
  { id: 'libro', n: 'Libro', css: "'Literata', Georgia, serif", k: 'literata' },

  { id: 'comic', n: 'Cómic', css: "'Comic Neue', cursive", k: 'comic neue' },
  { id: 'maquina', n: 'Máquina de escribir', css: "'Courier Prime', monospace", k: 'courier prime' },
  { id: 'ligada', n: 'Ligada', css: "'Playwrite ES', cursive", k: 'playwrite es' }
];
const TAMANOS = [
  { n: 'Pequeña', v: '0.85em' }, { n: 'Normal', v: '1em' }, { n: 'Grande', v: '1.3em' },
  { n: 'Muy grande', v: '1.7em' }, { n: 'Enorme', v: '2.2em' }
];
const COLORES_TEXTO = ['#c0392b','#d35400','#b7950b','#1e8449','#138d75','#2471a3','#1a3e72','#7d3c98','#c2185b','#6e4b2a','#707b7c'];
const CFG_DEF = { escritura: true, valoraciones: true, resenas: true, minPalabras: 30, soloMiCiclo: false, aviso: '', minVotosPodio: 3, curso: '' };
const CICLOS = [
  { n: 1, nombre: 'Primer ciclo', cursos: '1º y 2º' },
  { n: 2, nombre: 'Segundo ciclo', cursos: '3º y 4º' },
  { n: 3, nombre: 'Tercer ciclo', cursos: '5º y 6º' }
];
/* El ciclo se deduce del grupo: «4ºA» → segundo ciclo. Sin número al principio → 0 (desconocido). */
function cicloDeGrupo(g) { const m = String(g || '').trim().match(/^([1-6])/); if (!m) return 0; const n = +m[1]; return n <= 2 ? 1 : n <= 4 ? 2 : 3; }
const nombreCiclo = n => (CICLOS.find(c => c.n === n) || { nombre: 'Sin ciclo' }).nombre;
/* Curso escolar de septiembre a agosto: octubre de 2026 → «2026-27» */
function cursoEscolar(f = new Date()) { const y = f.getFullYear(); return f.getMonth() >= 8 ? y + '-' + String(y + 1).slice(2) : (y - 1) + '-' + String(y).slice(2); }
const EMPIEZOS = ['Me ha gustado…','Mi parte favorita es…','El personaje que más me gusta es…','Me ha sorprendido…','Podría mejorar…','Se lo recomiendo a…'];
const TXT_ESTRELLAS = ['', 'No me ha gustado', 'Regular', 'Está bien', 'Me ha gustado mucho', '¡Me ha encantado!'];

/* Palabras no permitidas (se comparan sin tildes y en minúsculas) */
const PROHIBIDAS = ['puta','puto','putas','putos','mierda','mierdas','joder','jodete','gilipollas','gilipolla','cabron','cabrona','cabrones','maricon','maricones','polla','pollas','follar','follando','zorra','zorras','subnormal','subnormales','mamon','capullo','capulla','imbecil','imbeciles','hijoputa','cojones','pendejo','pendeja'];
const PROHIBIDAS_RESENA = ['tonto','tonta','tontos','tontas','idiota','idiotas','estupido','estupida','estupidos','estupidas','basura','asco','asquerosa','asqueroso','pringado','pringada','penosa','penoso'];
function palabrasMalas(texto, estricto) {
  const t = ' ' + normal(texto).replace(/[^a-zñ0-9]+/g, ' ') + ' ';
  const lista = estricto ? PROHIBIDAS.concat(PROHIBIDAS_RESENA) : PROHIBIDAS;
  return lista.filter(p => t.includes(' ' + normal(p) + ' ') || (p === 'hijoputa' && t.includes(' hijo de puta ')));
}

/* ---------------------------- estado ---------------------------- */
const E = {
  ses: null,          // {uid, email, tok, exp, ref, recordar}
  yo: null,           // {uid, nombre, grupo, alias, ciclo}
  cfg: { ...CFG_DEF },
  relatos: {},        // id -> ficha (caché)
  sync: null,         // readTime del último sync incremental
  cargados: [],       // alcances ya descargados: «ciclo:curso» o «ciclo:*»

};

/* =========================================================================
   FIREBASE (REST)
   ========================================================================= */
class ErrorFB extends Error { constructor(msg, cod, estado) { super(msg); this.cod = cod; this.estado = estado; } }

async function pedir(url, opc = {}) {
  let r;
  try { r = await fetch(url, opc); }
  catch (e) { throw new ErrorFB('No hay conexión a internet. Comprueba la red y vuelve a intentarlo.', 'RED', 0); }
  let j = null; const t = await r.text();
  try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) {
    const e = (Array.isArray(j) ? j[0] : j)?.error || {};
    throw new ErrorFB(e.message || ('Error ' + r.status), e.status || e.message || ('HTTP' + r.status), r.status);
  }
  return j;
}

function guardarSesion() {
  const s = E.ses; if (!s) return;
  const datos = JSON.stringify({ uid: s.uid, email: s.email, ref: s.ref, tok: s.tok, exp: s.exp });
  try {
    sessionStorage.setItem(PREF + 'ses', datos);
    if (s.recordar) localStorage.setItem(PREF + 'ses', datos); else localStorage.removeItem(PREF + 'ses');
  } catch {}
}
function leerSesion() {
  try {
    const t = sessionStorage.getItem(PREF + 'ses'); if (t) { const s = JSON.parse(t); s.recordar = !!localStorage.getItem(PREF + 'ses'); return s; }
    const l = localStorage.getItem(PREF + 'ses'); if (l) { const s = JSON.parse(l); s.recordar = true; return s; }
  } catch {}
  return null;
}
function borrarSesion() { try { sessionStorage.removeItem(PREF + 'ses'); localStorage.removeItem(PREF + 'ses'); } catch {} }

async function entrar(usuario, clave, recordar) {
  usuario = usuario.trim();
  const email = usuario.includes('@') ? usuario.toLowerCase() : usuario.toLowerCase().replace(/\s+/g, '') + '@' + FB.dominio;
  const intento = async pass => pedir(URL_AUTH, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass, returnSecureToken: true }) });
  let j;
  try { j = await intento(clave); }
  catch (e) {
    if (clave !== clave.toLowerCase() && /INVALID|PASSWORD|CREDENTIAL/.test(e.cod)) j = await intento(clave.toLowerCase());
    else throw e;
  }
  E.ses = { uid: j.localId, email: j.email, tok: j.idToken, ref: j.refreshToken, exp: ahora() + (+j.expiresIn) * 1000, recordar };
  guardarSesion();
}

async function token() {
  const s = E.ses; if (!s) throw new ErrorFB('Sesión cerrada', 'SIN_SESION', 401);
  if (s.tok && ahora() < s.exp - 5 * 60 * 1000) return s.tok;
  const j = await pedir(URL_TOKEN, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.ref) });
  s.tok = j.id_token; s.ref = j.refresh_token; s.exp = ahora() + (+j.expires_in) * 1000;
  guardarSesion();
  return s.tok;
}

async function fs(metodo, ruta, cuerpo) {
  const llamar = async () => pedir(URL_FS + ruta, {

  if ('timestampValue' in v) return v.timestampValue;

  if (/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL|CREDENTIAL/.test(c)) return 'Usuario o clave incorrectos.';
  if (/TOO_MANY/.test(c)) return 'Demasiados intentos. Espera unos minutos y vuelve a probar.';
  if (/USER_DISABLED/.test(c)) return 'Esta cuenta está desactivada. Habla con tu maestro.';
  if (/PERMISSION_DENIED/.test(c) || e.estado === 403) return 'No tienes permiso para hacer esto. Si crees que es un error, avisa a tu maestro.';
  if (/RESOURCE_EXHAUSTED/.test(c)) return 'La biblioteca ha llegado al límite de uso de hoy. Prueba mañana.';

const votosDe = f => Object.values(f.votos || {}).filter(n => n >= 1 && n <= 5);
function media(f) { const v = votosDe(f); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; }
function puntuacion(f) { const v = votosDe(f); const C = 3, m = 3.5; return (C * m + v.reduce((a, b) => a + b, 0)) / (C + v.length); }
const nVotos = f => votosDe(f).length;
const nResenas = f => Object.keys(f.res || {}).length;
const nLecturas = f => Object.keys(f.leido || {}).length;
const esMia = f => E.yo && f.autorUid === E.yo.uid;
/* Obras publicadas de un ciclo (y de un curso, si se indica). Sin ciclo: las de mi ciclo. */
function publicadas({ ciclo = E.yo.ciclo, curso = '' } = {}) {
  return Object.values(E.relatos).filter(f => f.estado === 'publicado' && (!ciclo || f.ciclo === ciclo) && (!curso || f.curso === curso));
}
function ciclosVisibles() { return E.cfg.soloMiCiclo && E.yo.ciclo ? [E.yo.ciclo] : [1, 2, 3]; }
function hoy0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }

async function iniciar() {
  const s = E.ses;
  if (s.email === FB.admin) { borrarSesion(); E.ses = null; throw new ErrorFB('Esta es la biblioteca del alumnado. Para administrarla usa la app de administración.', 'NO_ALTA', 403); }
  let u = null;
  try { u = await leerDoc('users/' + s.uid); } catch (e) { if (e.estado !== 403) throw e; }
  if (!u || u.baja) { borrarSesion(); E.ses = null; throw new ErrorFB(u && u.baja ? 'Este usuario está dado de baja. Habla con tu maestro.' : 'Tu usuario no está dado de alta en el colegio. Habla con tu maestro.', 'NO_ALTA', 403); }
  const grupo = u.grupo || '';
  E.yo = { uid: s.uid, nombre: u.nombre || u.alias || 'Alumno', grupo, alias: u.alias || '', ciclo: cicloDeGrupo(grupo) };
  cargarCache();
  await cargarConfig(true);
  podarCache();
  await Promise.all([sincronizar(true), cargarDeAutor(E.yo.uid)]);
  reiniciarNav('inicio');
  const vistas = ls.get('normasVistas', []);
  if (!vistas.includes(E.yo.uid)) { vistas.push(E.yo.uid); ls.set('normasVistas', vistas.slice(-60)); normas(); }
}
/* Al empezar un curso nuevo, la caché olvida los alcances del curso anterior */
function podarCache() {
  const cur = cursoActual();
  const antes = E.cargados.length;
  E.cargados = E.cargados.filter(k => k.endsWith(':*') || k.endsWith(':' + cur));
  if (E.cargados.length !== antes) {
    for (const id of Object.keys(E.relatos)) { const f = E.relatos[id]; if (!alcanceCubre(f) && !esMia(f)) delete E.relatos[id]; }
    guardarCache();
  }
}

/* =========================================================================

const ORDENES = [
  ['valoradas', 'Mejor valoradas'], ['recientes', 'Más recientes'], ['leidas', 'Más leídas'],
  ['resenas', 'Más reseñas'], ['titulo', 'Título (A-Z)'], ['autor', 'Autor (A-Z)']
];
VISTAS.biblioteca = async (main, p) => {
  main.innerHTML = cargando();
  await sincronizar().catch(e => tostada(mensajeError(e), 'mal'));
  const pref = ls.get('filtros', {});
  const cicloIni = ciclosVisibles().includes(E.yo.ciclo) ? E.yo.ciclo : ciclosVisibles()[0];
  const F = { q: '', orden: pref.orden || 'recientes', ciclo: p.ciclo || cicloIni, curso: p.curso || 'actual', grupo: p.grupo || '', genero: '', ver: 'todas' };
  const cursoSel = () => F.curso === 'actual' ? cursoActual() : '';
  const ver = () => publicadas({ ciclo: F.ciclo, curso: cursoSel() });
  const ciclos = ciclosVisibles();
  main.innerHTML = `
    <h1 style="font-size:2rem;margin-bottom:14px">Biblioteca</h1>
    <div class="filtros">
      ${ciclos.length > 1 ? `<div class="chips" id="f-ciclos">${ciclos.map(n => `<button data-c="${n}" class="${F.ciclo === n ? 'on' : ''}">${esc(nombreCiclo(n))}</button>`).join('')}</div>` : `<p class="nota" style="margin:0">${esc(nombreCiclo(F.ciclo))}</p>`}
      <label class="busca"><span class="sr">Buscar</span><input type="search" id="f-q" placeholder="Buscar por título o autor"></label>
      <div class="chips" id="f-grupos"></div>
      <div class="orden">
        <label><span class="sr">Curso</span><select id="f-curso"><option value="actual" ${F.curso === 'actual' ? 'selected' : ''}>Este curso</option><option value="todos" ${F.curso === 'todos' ? 'selected' : ''}>Todos los cursos</option></select></label>
        <label><span class="sr">Ordenar</span><select id="f-orden">${ORDENES.map(([v, t]) => `<option value="${v}" ${F.orden === v ? 'selected' : ''}>Ordenar: ${t}</option>`).join('')}</select></label>
        <label><span class="sr">Tipo</span><select id="f-gen"><option value="">Todos los tipos</option>${GENEROS.map(g => `<option>${g}</option>`).join('')}</select></label>
        <label class="solo"><span class="sr">Mostrar</span><select id="f-ver">
          <option value="todas">Mostrar todas</option><option value="noleidas">Solo las que no he leído</option><option value="leidas">Solo las que he leído</option>
</select></label>
      </div>
    </div>
    <p class="contador" id="contador"></p>
    <div id="estanteria"></div>`;
  const pintarGrupos = () => {
    const grupos = [...new Set(ver().map(f => f.autorGrupo).filter(Boolean))].sort(comparaTexto);
    if (F.grupo && !grupos.includes(F.grupo)) F.grupo = '';
    $('#f-grupos').innerHTML = grupos.length > 1 ? `<button data-g="" class="${!F.grupo ? 'on' : ''}">Todos</button>${grupos.map(g => `<button data-g="${esc(g)}" class="${F.grupo === g ? 'on' : ''}">${esc(g)}</button>`).join('')}` : '';
  };
  const pintarLista = () => {
    const q = normal(F.q.trim());
    let l = ver().filter(f => {
      if (F.grupo && f.autorGrupo !== F.grupo) return false;
      if (F.genero && f.genero !== F.genero) return false;
      if (F.ver === 'noleidas' && (esMia(f) || (f.leido && f.leido[E.yo.uid]))) return false;
      if (F.ver === 'leidas' && !(f.leido && f.leido[E.yo.uid])) return false;
      if (q && !normal(f.titulo + ' ' + f.autorNombre).includes(q)) return false;
      return true;
    });
    const cmp = {
      valoradas: (a, b) => puntuacion(b) - puntuacion(a) || nVotos(b) - nVotos(a),
      recientes: (a, b) => (b.publicado || 0) - (a.publicado || 0),
      leidas: (a, b) => nLecturas(b) - nLecturas(a) || puntuacion(b) - puntuacion(a),
      resenas: (a, b) => nResenas(b) - nResenas(a) || puntuacion(b) - puntuacion(a),
      titulo: (a, b) => comparaTexto(a.titulo, b.titulo),
      autor: (a, b) => comparaTexto(a.autorNombre, b.autorNombre) || comparaTexto(a.titulo, b.titulo)
    }[F.orden];
    l.sort(cmp);
    $('#contador').textContent = (l.length === 1 ? '1 obra' : l.length + ' obras') + (F.orden === 'valoradas' ? '. Las obras con más votos cuentan más.' : '');
    $('#estanteria').innerHTML = l.length ? `<div class="estanteria">${l.map(libro).join('')}</div>`

    enlazarLibros($('#estanteria'));
  };
  async function cambiarAlcance() {
    $('#estanteria').innerHTML = cargando();
    try { await asegurarAlcance(F.ciclo, F.curso === 'actual' ? cursoActual() : '*'); }
    catch (e) { tostada(mensajeError(e), 'mal'); }
    pintarGrupos(); pintarLista();
  }
  $('#f-q').addEventListener('input', e => { F.q = e.target.value; pintarLista(); });
  $('#f-orden').addEventListener('change', e => { F.orden = e.target.value; ls.set('filtros', { orden: F.orden }); pintarLista(); });
  $('#f-gen').addEventListener('change', e => { F.genero = e.target.value; pintarLista(); });
  $('#f-ver').addEventListener('change', e => { F.ver = e.target.value; pintarLista(); });
  $('#f-curso').addEventListener('change', e => { F.curso = e.target.value; cambiarAlcance(); });
  $('#f-ciclos') && $('#f-ciclos').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; F.ciclo = +b.dataset.c;
    $$('#f-ciclos button').forEach(x => x.classList.toggle('on', x === b)); cambiarAlcance();
  });
  $('#f-grupos').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; F.grupo = b.dataset.g;
    $$('#f-grupos button').forEach(x => x.classList.toggle('on', x === b)); pintarLista();
  });
  if (F.ciclo !== E.yo.ciclo || F.curso !== 'actual') await cambiarAlcance(); else { pintarGrupos(); pintarLista(); }
};

  // herramientas de lectura
  const lect = $('#lectura');
  const guardaPref = () => ls.set('lectura', prefs);
  $('#z-mas').onclick = () => { prefs.zoom = Math.min(1.8, +(prefs.zoom + 0.1).toFixed(2)); lect.style.setProperty('--zoom', prefs.zoom); guardaPref(); };
  $('#z-menos').onclick = () => { prefs.zoom = Math.max(0.8, +(prefs.zoom - 0.1).toFixed(2)); lect.style.setProperty('--zoom', prefs.zoom); guardaPref(); };

  $('#b-edit') && ($('#b-edit').onclick = () => ir('editor', { id: f.id }));
  prepararVoz($('#b-voz'), () => textoPlano(html), f.titulo);

  // marcar como leída al llegar al final
  let desbloqueado = mia || !!(f.leido && f.leido[yo.uid]);
  const alFinal = async () => {
    if (desbloqueado) return; desbloqueado = true; pintarValorar();
    if (f.estado !== 'publicado') return;
    try {
      await confirmar([W.cambiar('lit_relatos/' + f.id, { leido: { [yo.uid]: true } }, [campoMapa('leido', yo.uid)], { act: true })]);
      f.leido = { ...(f.leido || {}), [yo.uid]: true }; guardarCache();
      tostada('📖 ¡Obra leída! Ya puedes valorarla.', 'ok');
    } catch (e) { console.warn(e); }
  };
  if (!desbloqueado && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver(en => { if (en.some(x => x.isIntersecting)) { io.disconnect(); alFinal(); } }, { threshold: 1 });
    io.observe($('#fin'));
    guardaSalida = async () => { io.disconnect(); return true; };
  } else if (!desbloqueado) alFinal();

  // valoración
  let reseñas = [];
  const miRes = () => reseñas.find(r => r.autorUid === yo.uid);

    const sec = $('#valorar'); if (!sec) return;

      sec.innerHTML = `<div class="bloqueo"><span class="ic">🔒</span><div><b>Llega al final para valorar</b><br>Cuando termines de leer, podrás poner estrellas y escribir tu reseña.</div></div>`; return;
    }
    const miVoto = (f.votos || {})[yo.uid] || 0; const r = miRes();
    let sel = miVoto;
    sec.innerHTML = `<div class="hoja">
      <h2>${miVoto || r ? 'Tu opinión' : '¿Qué te ha parecido?'}</h2>

        <div class="selestr-txt" id="s-txt">${TXT_ESTRELLAS[sel] || 'Toca las estrellas'}</div>` : ''}
      ${cfg.resenas ? `<label class="campo" style="margin-top:14px"><span>Tu reseña <small>(opcional)</small></span>
        <div class="empiezos">${EMPIEZOS.map(t => `<button type="button" data-emp="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <textarea id="r-txt" maxlength="800" placeholder="Cuenta qué te ha gustado y qué mejorarías. Habla de la obra, no de la persona.">${esc(r ? r.texto : '')}</textarea>
        <div class="cuenta"><span id="r-n">0</span>/800</div></label>` : ''}

    pintaSel(sel);
    $$('.selestr button', sec).forEach(b => {
      b.onclick = () => { sel = +b.dataset.n; pintaSel(sel); };

      $$('[data-emp]', sec).forEach(b => b.onclick = () => { const s = b.dataset.emp.replace('…', ' '); ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + s; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); cuenta(); });

  async function enviarValoracion(estrellas, texto) {
    const cfg = E.cfg; texto = (texto || '').trim();
    if (cfg.valoraciones && !estrellas) return avisar('Faltan las estrellas', 'Toca de 1 a 5 estrellas para valorar la obra.', '⭐');
    const anterior = miRes();
    if (texto && texto.length < 15) return avisar('Reseña muy corta', 'Escribe al menos una frase completa: qué te ha gustado o qué mejorarías.', '✍️');
    const malas = palabrasMalas(texto, true);
    if (malas.length) return avisar('Revisa tu reseña', `Cambia ${malas.map(m => '<b>' + esc(m) + '</b>').join(', ')}. En las reseñas se habla de la obra con respeto.`, '🙊');
    const btn = $('#r-env'); btn.disabled = true;
    const ws = []; const campos = []; const datos = { votos: {}, res: {} };
    if (cfg.valoraciones && estrellas) { datos.votos[yo.uid] = estrellas; campos.push(campoMapa('votos', yo.uid)); }
    const rid = f.id + '_' + yo.uid; const t0 = ahora();
    if (texto && cfg.resenas) {
      datos.res[yo.uid] = t0; campos.push(campoMapa('res', yo.uid));
      ws.push(W.poner('lit_resenas/' + rid, anterior
        ? { relatoId: f.id, autorUid: yo.uid, nombre: anterior.nombre, grupo: anterior.grupo, estrellas: estrellas || 0, texto, fecha: t0, avisada: !!anterior.avisada }
        : { relatoId: f.id, autorUid: yo.uid, nombre: yo.nombre, grupo: yo.grupo, estrellas: estrellas || 0, texto, fecha: t0, avisada: false }));
    } else if (!texto && anterior) {
      campos.push(campoMapa('res', yo.uid)); ws.push(W.borrar('lit_resenas/' + rid));
    }
    if (campos.length) ws.unshift(W.cambiar('lit_relatos/' + f.id, datos, campos, { act: true }));
    if (!ws.length) { btn.disabled = false; return; }
    try {
      await confirmar(ws);
      const g = E.relatos[f.id];
      if (datos.votos[yo.uid]) g.votos = { ...(g.votos || {}), [yo.uid]: estrellas };
      g.res = { ...(g.res || {}) }; if (datos.res[yo.uid]) g.res[yo.uid] = t0; else if (!texto) delete g.res[yo.uid];
      guardarCache(); delete E.resenasCache[f.id];
      tostada(texto ? '¡Gracias! Tu opinión ya está publicada.' : '¡Valoración guardada!', 'ok');
      await cargarResenas(true); pintarValorar(); actualizarCabecera();
    } catch (e) { btn.disabled = false; avisar('No se ha podido guardar', mensajeError(e), '⚠️'); }
  }
  async function borrarResena(r) {
    if (!r) return;
    if (!(await preguntar('¿Borrar la reseña?', 'Se borrará el texto. Tus estrellas se mantienen.', 'Borrar', 'Cancelar', true))) return;
    try {
      await confirmar([W.borrar('lit_resenas/' + r.id), W.cambiar('lit_relatos/' + f.id, { res: {} }, [campoMapa('res', r.autorUid)], { act: true })]);
      const g = E.relatos[f.id]; g.res = { ...(g.res || {}) }; delete g.res[r.autorUid]; guardarCache(); delete E.resenasCache[f.id];
      tostada('Reseña borrada'); await cargarResenas(true); pintarValorar(); actualizarCabecera();
    } catch (e) { avisar('No se ha podido borrar', mensajeError(e), '⚠️'); }
  }
  function actualizarCabecera() { /* repinta los datos de votos sin recargar la vista */
    const d = $$('.ficha .datos')[1]; if (!d) return; const g = E.relatos[f.id];
    const ch = d.firstElementChild;
    ch.outerHTML = nVotos(g) ? `<span class="est">${htmlEstrellas(media(g), true)} ${nfmt(media(g))} <span style="font-weight:400;color:var(--gris)">(${nVotos(g)} ${nVotos(g) === 1 ? 'voto' : 'votos'})</span></span>` : '<span>Aún sin valoraciones</span>';
  }

  async function cargarResenas(forzar) {
    const caja = $('#resenas'); if (!caja) return;
    const g = E.relatos[f.id] || f;
    const firma = JSON.stringify(Object.entries(g.res || {}).sort());
    const c = E.resenasCache[f.id];
    if (!forzar && c && c.firma === firma) reseñas = c.lista;
    else if (!Object.keys(g.res || {}).length) reseñas = [];
    else {
      try { reseñas = (await consultar('lit_resenas', { donde: [['relatoId', 'EQUAL', f.id]] })).docs; }
      catch (e) { caja.innerHTML = `<div class="vacio">${mensajeError(e)}</div>`; return; }
      E.resenasCache[f.id] = { firma, lista: reseñas };
    }
    reseñas.sort((a, b) => (b.autorUid === E.yo.uid) - (a.autorUid === E.yo.uid) || b.fecha - a.fecha);
    if (mia) ls.set('vistoRes.' + yo.uid, Math.max(ls.get('vistoRes.' + yo.uid, 0), ...reseñas.map(r => r.fecha || 0)));
    caja.innerHTML = reseñas.length ? `<div class="resenas">${reseñas.map(r => {
      const propia = r.autorUid === yo.uid;
      return `<article class="resena ${propia ? 'mia' : ''}">
        <div class="cab"><span class="av" style="background:${colorPersona(r.autorUid)}">${esc(iniciales(r.nombre))}</span>
          <span class="quien"><b>${esc(r.nombre)}${propia ? ' (tú)' : ''}</b><small>${esc(r.grupo || '')}${r.fecha ? ', ' + haceTiempo(r.fecha) : ''}</small></span>
          ${r.estrellas ? htmlEstrellas(r.estrellas) : ''}</div>
        <p>${esc(r.texto)}</p>
        <div class="acts">
          ${!propia && !r.avisada ? `<button class="btn txt peq" data-avisar="${esc(r.id)}">🚩 Avisar al maestro</button>` : ''}
        </div></article>`;
    }).join('')}</div>` : `<div class="vacio"><p>${mia ? 'Todavía nadie ha escrito una reseña de tu obra.' : 'Nadie ha escrito una reseña todavía. ¡Puedes ser el primero!'}</p></div>`;
    $$('[data-avisar]', caja).forEach(b => b.onclick = async () => {

      catch (e) { avisar('No se ha podido avisar', mensajeError(e), '⚠️'); }
    });
  }
  pintarValorar();
  await cargarResenas();
  pintarValorar();
};

/* Lectura en voz alta */
function prepararVoz(boton, sacarTexto, titulo) {
  if (!('speechSynthesis' in window)) return;
  const voz = () => speechSynthesis.getVoices().find(v => /^es[-_]ES/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^es/i.test(v.lang));
  const mostrar = () => { if (voz()) boton.classList.remove('oculto'); };
  mostrar(); speechSynthesis.addEventListener('voiceschanged', mostrar, { once: true });
  let hablando = false;
  boton.onclick = () => {
    if (hablando) { speechSynthesis.cancel(); hablando = false; boton.textContent = '🔊 Escuchar'; boton.classList.remove('on'); return; }
    const v = voz(); if (!v) return;
    const trozos = ((titulo ? titulo + '.\n' : '') + sacarTexto()).match(/[^.!?¡¿\n]+[.!?…]*|\n+/g) || [];
    const frases = []; let actual = '';
    for (const t of trozos) { if ((actual + t).length > 220) { frases.push(actual); actual = t; } else actual += t; }
    if (actual.trim()) frases.push(actual);
    speechSynthesis.cancel(); hablando = true; boton.textContent = '⏹️ Parar'; boton.classList.add('on');
    frases.forEach((fr, i) => {
      const u = new SpeechSynthesisUtterance(fr.trim()); u.voice = v; u.lang = v.lang; u.rate = 0.95;
      if (i === frases.length - 1) u.onend = () => { hablando = false; boton.textContent = '🔊 Escuchar'; boton.classList.remove('on'); };
      speechSynthesis.speak(u);
    });
  };
}

function estadisticas(uid) {
  const todas = Object.values(E.relatos);
  const pub = todas.filter(f => f.autorUid === uid && f.estado === 'publicado');
  const otras = todas.filter(f => f.estado === 'publicado' && f.autorUid !== uid);
  const recibidos = pub.flatMap(votosDe);
  return {
    publicadas: pub.length,
    palabras: pub.reduce((a, f) => a + (f.palabras || 0), 0),
    leidas: otras.filter(f => f.leido && f.leido[uid]).length,
    votosDados: otras.filter(f => f.votos && f.votos[uid]).length,
    resenas: todas.filter(f => f.res && f.res[uid]).length,
    media: recibidos.length ? recibidos.reduce((a, b) => a + b, 0) / recibidos.length : 0,
    votosRecibidos: recibidos.length,
    lecturasRecibidas: pub.reduce((a, f) => a + nLecturas(f), 0),
    estrella: pub.some(f => nVotos(f) >= 5 && media(f) >= 4.5),
    generos: new Set(pub.map(f => f.genero)).size
  };
}

    <div class="cifras">
      <div class="cifra"><b>${s.publicadas}</b><span>obras publicadas</span></div>
      <div class="cifra"><b>${s.palabras}</b><span>palabras escritas</span></div>
      <div class="cifra"><b>${s.leidas}</b><span>obras leídas</span></div>
      <div class="cifra"><b>${s.votosDados}</b><span>valoraciones dadas</span></div>
      <div class="cifra"><b>${s.resenas}</b><span>reseñas escritas</span></div>
      <div class="cifra"><b>${s.votosRecibidos ? nfmt(s.media) : '—'}</b><span>nota media de tus obras</span></div>
    </div>
    <section class="seccion"><h2>🏅 Insignias</h2><div class="insignias">${INSIGNIAS.map(I => {
      const v = I.v(s), ok = v >= I.meta;
      return `<div class="insignia ${ok ? '' : 'no'}"><div class="ic">${I.ic}</div><b>${I.n}</b><small>${I.d}</small>${!ok && I.meta > 1 ? `<div class="barrita"><i style="width:${Math.min(100, v / I.meta * 100)}%"></i></div><small>${Math.min(v, I.meta)} de ${I.meta}</small>` : ''}</div>`;
    }).join('')}</div></section>`;
};

/* =========================================================================
   ARRANQUE
   ========================================================================= */
(async function arranque() {
  const s = leerSesion();
  if (!s) { reiniciarNav('login'); return; }
  E.ses = s;
  $('#app').innerHTML = `<div class="login"><div class="caja"><div class="logo">${LOGO(76)}<h1>Biblioteca Siurot</h1><p>Abriendo la biblioteca…</p></div></div></div>`;
  try { await iniciar(); }
  catch (e) {
    console.warn(e); borrarSesion(); E.ses = null; reiniciarNav('login');
    if (e.cod !== 'RED') $('#l-err') && ($('#l-err').innerHTML = `<div class="err">${e.cod === 'NO_ALTA' ? esc(e.message) : 'Vuelve a entrar con tu usuario y clave.'}</div>`);
    else $('#l-err') && ($('#l-err').innerHTML = `<div class="err">${mensajeError(e)}</div>`);
  }
})();

</script>
</body>
</html>
